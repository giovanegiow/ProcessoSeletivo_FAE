spring.application.name=demo

# Banco H2 em memória (os dados somem ao reiniciar)
spring.datasource.url=jdbc:h2:mem:fae
spring.h2.console.enabled=true

# Mostra as mensagens de validação no corpo da resposta 400
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Origens liberadas no CORS (separe por vírgula)
app.cors.allowed-origins=http://localhost:5173

# Mantém a sessão JPA aberta durante a serialização do JSON, para os endereços
# (carregamento LAZY) poderem ser lidos. Simples para este projeto; com DTOs
# daria para desligar.
spring.jpa.open-in-view=true
